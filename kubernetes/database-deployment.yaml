apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-service
spec:
  replicas: 1                           # Nur 1 Replica (Datenkonsistenz)
  selector:
    matchLabels:
      app: database-service
  template:
    metadata:
      labels:
        app: database-service
    spec:
      containers:
        - name: database-service
          image: database-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5002
          env:
            - name: DATA_FILE
              value: "/data/database-service.json"
          volumeMounts:
            - name: database-service-storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: database-service-storage
          persistentVolumeClaim:
            claimName: database-service-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: database-service
spec:
  type: ClusterIP                       # Nur intern erreichbar
  selector:
    app: database-service
  ports:
    - port: 5002
      targetPort: 5002

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-service-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi