# Frontend Service - von außen erreichbar
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort # IP ist auch von Außen gültig
  selector:
    app: frontend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30000

---

# Database Service - nicht von außen erreichbar. Nur über andere Pods und Services
# im gleichen Kubernetes Cluster

apiVersion: v1
kind: Service
metadata:
  name: database-service
spec:
  type: ClusterIP # IP ist nur innerhalb des Kubernetes Clusters gültig.
  selector:
    app: database-service
  ports:
    - port: 5002
      targetPort: 5002

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-service-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi